# /etc/nginx/conf.d/isuride-tuning.conf
# Goアプリ(:8080)へのupstream定義とHTTPレベルのチューニング
#
# このupstreamは webapp/nginx/sites-available/isuride.conf の
# proxy_pass から参照される(同ファイルも deploy_webapp.sh が同期する)。
# (proxy_set_header は location に既存定義があると上位レベルのものが
#  無効になるため、keepalive用の設定は conf.d 側には置けない)

upstream isuride_app {
    server 127.0.0.1:8080;
    # ワーカーごとにアイドル接続をキャッシュしてGoアプリへの接続張り直しを削減
    keepalive 64;
}

# 静的アセットの圧縮(html以外のテキスト系も対象にする)
# ※ gzip on; はメイン nginx.conf にあるためここでは書かない(重複エラーになるため)
gzip_types text/css application/javascript image/svg+xml;
gzip_min_length 1000;
gzip_comp_level 5;
