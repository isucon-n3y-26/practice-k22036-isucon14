# /etc/nginx/nginx.conf のデプロイ用ソース
# Ubuntu 24.04 (noble) の nginx パッケージ標準の内容を baseline とし、
# events ブロックのみ調整している。
# provisioning/deploy_webapp.sh がこのファイルをサーバへ rsync する。
#
# 【変更点 vs 標準】
# - worker_connections 768 → 4096
#   SSE ストリームが全期間コネクションを占有する(1ストリーム=下り+上りの2接続)。
#   椅子・ユーザー数百接続でデフォルトの 768 を超えると新規接続(静的ファイル取得等)が
#   受け付けられず、ベンチの GET /client 等が間欠失敗するため引き上げる。
# - worker_rlimit_nofile 追加(ワーカーのFD上限。auto ワーカー×4096接続に耐える値)

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 4096;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


