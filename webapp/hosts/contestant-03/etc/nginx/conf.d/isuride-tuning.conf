# contestant-03 (edge) 用オーバーレイ
# webapp/nginx/conf.d/isuride-tuning.conf の edge 向けレンダリング結果。
# deploy_webapp.sh が @APP_PRIVATE_IP@ を01の実IPに置換して
# /etc/nginx/conf.d/isuride-tuning.conf に同期する。
# (正本は webapp/nginx/conf.d/isuride-tuning.conf。upstream先以外は同一に保つこと)

upstream isuride_app {
    server @APP_PRIVATE_IP@:8080;
    # ワーカーごとにアイドル接続をキャッシュしてGoアプリへの接続張り直しを削減
    keepalive 64;
}

# 静的アセットの圧縮(html以外のテキスト系も対象にする)
# ※ gzip on; はメイン nginx.conf にあるためここでは書かない(重複エラーになるため)
gzip_types text/css application/javascript image/svg+xml;
gzip_min_length 1000;
gzip_comp_level 5;
